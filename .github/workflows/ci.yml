name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, runtime tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: delis_crm
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d delis_crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/delis_crm
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/delis_crm
      RUN_EXTERNAL_DATABASE_TESTS: "true"
      OWNER_LOGIN: ci-owner
      OWNER_NAME: CI Owner
      SEED_DEMO_DATA: "false"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run PostgreSQL-backed runtime tests
        run: npm test

      - name: Create a production build
        run: |
         export OWNER_PASSWORD="$(node -e 'console.log(require("node:crypto").randomBytes(24).toString("base64url"))')"
